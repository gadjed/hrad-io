<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRAD — навчання планувальника</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">RL · MaskablePPO · живий World</p>
        <h1>Навчання планувальника</h1>
      </div>
      <div class="top-actions">
        <span id="run-badge" class="badge idle">очікує</span>
        <button id="btn-start" class="primary" type="button">Старт</button>
        <button id="btn-stop" class="ghost" type="button" disabled>Стоп</button>
      </div>
    </header>

    <p id="command" class="command">python scripts/train-rl-ollama.py</p>

    <details class="panel config">
      <summary>Параметри запуску (та сама команда, що в терміналі)</summary>
      <form id="cfg" class="cfg-grid">
        <label>timesteps <input name="timesteps" type="number" value="1000000" /></label>
        <label>n-envs <input name="nEnvs" type="number" value="1" min="1" /></label>
        <label>n-steps <input name="nSteps" type="number" value="256" /></label>
        <label>batch-size <input name="batchSize" type="number" value="64" /></label>
        <label>learning-rate <input name="learningRate" type="number" step="0.0001" value="0.0003" /></label>
        <label>ticks <input name="ticks" type="number" value="10" /></label>
        <label>max-steps <input name="maxSteps" type="number" value="500" /></label>
        <label>ollama-freq <input name="ollamaFreq" type="number" value="1" min="1" /></label>
        <label>ollama-host <input name="ollamaHost" type="text" value="localhost" /></label>
        <label>ollama-port <input name="ollamaPort" type="number" value="11434" /></label>
        <label class="wide">ollama-model <input name="ollamaModel" type="text" value="gemma4:e4b" /></label>
        <label class="check"><input name="useOllama" type="checkbox" checked /> --use-ollama</label>
        <label class="check"><input name="noEval" type="checkbox" checked /> --no-eval</label>
        <label class="check"><input name="resume" type="checkbox" /> --resume</label>
      </form>
    </details>

    <section id="kpis" class="kpis"></section>
    <section id="stuck" class="stuck" hidden></section>

    <section class="variants">
      <article class="variant" id="card-prev">
        <header>
          <div>
            <p class="eyebrow">Попередній варіант</p>
            <h2 id="prev-title">ще немає оцінки Ollama</h2>
          </div>
          <div id="prev-score" class="score idle">—</div>
        </header>
        <canvas id="prev-canvas" width="640" height="420"></canvas>
        <div id="prev-meta" class="meta"></div>
      </article>
      <article class="variant current" id="card-curr">
        <header>
          <div>
            <p class="eyebrow">Поточна пропозиція мережі</p>
            <h2 id="curr-title">очікує перший крок</h2>
          </div>
          <div id="curr-score" class="score idle">—</div>
        </header>
        <canvas id="curr-canvas" width="640" height="420"></canvas>
        <div id="curr-meta" class="meta"></div>
      </article>
    </section>

    <section class="charts">
      <figure>
        <figcaption>Reward кроку</figcaption>
        <canvas id="ch-reward"></canvas>
      </figure>
      <figure>
        <figcaption>Utility форту</figcaption>
        <canvas id="ch-utility"></canvas>
      </figure>
      <figure>
        <figcaption>Ollama score</figcaption>
        <canvas id="ch-ollama"></canvas>
      </figure>
      <figure>
        <figcaption>Навченість (останні 100 Ollama)</figcaption>
        <canvas id="ch-ollama-pie"></canvas>
      </figure>
      <figure>
        <figcaption>Хронологія Ollama (1 = ок &gt;7)</figcaption>
        <canvas id="ch-ollama-ok"></canvas>
      </figure>
      <figure>
        <figcaption>Episode reward (SB3)</figcaption>
        <canvas id="ch-eprew"></canvas>
      </figure>
      <figure>
        <figcaption>Policy / value loss</figcaption>
        <canvas id="ch-loss"></canvas>
      </figure>
      <figure>
        <figcaption>Entropy · explained var · clip</figcaption>
        <canvas id="ch-stab"></canvas>
      </figure>
      <figure>
        <figcaption>GPU завантаження %</figcaption>
        <canvas id="ch-gpu-util"></canvas>
      </figure>
      <figure>
        <figcaption>GPU температура °C</figcaption>
        <canvas id="ch-gpu-temp"></canvas>
      </figure>
    </section>

    <section class="bottom">
      <article class="panel">
        <h3>Дії політики</h3>
        <div id="actions" class="actions"></div>
        <h3>Історія пропозицій</h3>
        <ol id="history" class="history"></ol>
      </article>
      <article class="panel">
        <h3>Лог процесу</h3>
        <pre id="logs" class="logs"></pre>
      </article>
    </section>

    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
